<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡拉OK神歡唱系統</title>
  <link rel="stylesheet" href="style.css">
  <script src="/eel.js"></script>
</head>

<body>
  <div id="app" class="fade-in">
    <header class="top-bar">
      <div class="brand">
        <h1>卡拉OK神歡唱系統</h1>
        <p class="tagline">原唱導唱 · 快速歡唱 · AI 立體聲伴奏</p>
      </div>

      <div class="search-area">
        <form id="search-form" class="search-container" role="search">
          <label for="search-input" class="visually-hidden">搜尋歌曲或輸入 YouTube 網址</label>
          <input type="search" id="search-input" maxlength="300" autocomplete="off" placeholder="輸入搜尋關鍵字或 YouTube 網址...">
          <div class="loader" id="search-loader" role="progressbar" aria-label="搜尋中" hidden></div>
          <button type="submit" class="btn" id="search-btn">
            <span aria-hidden="true">⌕</span> 搜尋
          </button>
        </form>
        <p id="search-status" class="search-status" role="status" aria-live="polite">搜尋歌曲或匯入清單，開始歡唱</p>
      </div>
    </header>

    <div id="app-error-wrap" class="error-banner" hidden>
      <p id="app-error" role="alert" aria-live="assertive"></p>
      <button type="button" class="btn btn-ghost btn-small" id="app-error-close" aria-label="關閉錯誤訊息">×</button>
    </div>

    <section class="results-section" id="results-section" aria-labelledby="results-heading" hidden>
      <h2 id="results-heading" class="section-heading">搜尋結果</h2>
      <div class="results-grid" id="results-grid">
        <!-- Results will be injected here -->
      </div>
    </section>

    <main class="main-content">
      <section class="player-section" aria-label="影音播放器">
        <div id="video-wrapper">
          <video id="player" controls crossorigin="anonymous" preload="auto"></video>
        </div>

        <div class="controls-row">
          <div class="song-info">
            <h2 id="now-playing-title">尚未播放歌曲</h2>
            <span id="now-quality" class="chip quality-chip" hidden></span>
            <span id="play-status" class="chip status-chip" role="status" aria-live="polite"></span>
            <button type="button" class="btn btn-small" id="skip-btn" title="下一首 (Ctrl+N)">
              <span aria-hidden="true">⏭</span> 切歌
            </button>
          </div>

          <div class="media-controls">
            <div class="volume-container">
              <button type="button" class="icon-btn" id="mute-btn" aria-label="靜音" aria-pressed="false">
                <span id="volume-icon" aria-hidden="true">🔊</span>
              </button>
              <label for="volume-slider" class="visually-hidden">播放音量</label>
              <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" aria-valuetext="100%">
              <output id="volume-val" for="volume-slider" class="volume-val">100%</output>
            </div>

            <div class="quality-selector">
              <label for="quality-select">畫質上限</label>
              <select id="quality-select">
                <option value="720">720p 省空間</option>
                <option value="1080" selected>1080p 推薦</option>
                <option value="1440">2K (1440p)</option>
              </select>
            </div>

            <div class="mode-segmented" role="group" aria-label="演唱模式">
              <button type="button" class="mode-btn guide active" id="mode-guide" aria-pressed="true">導唱</button>
              <button type="button" class="mode-btn singing" id="mode-singing" aria-pressed="false">歡唱</button>
            </div>
          </div>

          <!-- Quick mix controls (singing mode only) -->
          <div class="quick-mix" id="quick-mix" hidden>
            <div class="mix-control" id="quick-controls">
              <label for="vocal-strength">中央人聲削弱</label>
              <input type="range" id="vocal-strength" min="0" max="1" step="0.05" value="0.8">
              <output id="vocal-strength-val" for="vocal-strength">80%</output>
            </div>
            <div class="mix-control">
              <label for="accompaniment-gain">伴奏增益</label>
              <input type="range" id="accompaniment-gain" min="0" max="1.5" step="0.1" value="1">
              <output id="accompaniment-gain-val" for="accompaniment-gain">1.0x</output>
            </div>
          </div>
        </div>

        <details class="panel ai-panel" id="ai-details" open>
          <summary>
            <span class="panel-title">AI 伴奏工作室</span>
            <span id="ai-summary" class="panel-summary"></span>
          </summary>
          <div class="panel-body">
            <div class="ai-action-row">
              <button type="button" class="btn btn-compact" id="prepare-ai-btn" aria-describedby="ai-status" disabled>製作 AI 伴奏</button>
              <button type="button" class="btn btn-ghost btn-small" id="cancel-ai-btn" hidden>取消製作</button>
              <button type="button" class="btn btn-ghost btn-danger-ghost btn-small" id="clear-ai-cache-btn" title="清除此首 AI 伴奏快取，以便用新畫質重新製作" hidden>清除快取</button>
              <p id="ai-status" class="ai-status" role="status" aria-live="polite">正在檢查 AI 環境…</p>
            </div>
            <div id="ai-progress-panel" class="ai-progress-panel" hidden>
              <div class="ai-progress-heading">
                <span id="ai-progress-stage">準備中</span>
                <span id="ai-progress-percent">等待進度…</span>
              </div>
              <progress id="ai-progress" max="100" aria-label="目前 AI 工作階段進度"></progress>
              <div class="ai-progress-meta">
                <span id="ai-progress-detail"></span>
                <span id="ai-progress-elapsed"></span>
              </div>
            </div>
            <label class="ai-toggle">
              <input type="checkbox" id="use-ai" disabled> 使用 AI 伴奏（完成後可切換原唱／歡唱）
            </label>
            <p class="mode-note" id="mode-detail">快速模式：削弱中央人聲，也可能影響中央樂器</p>
          </div>
        </details>

        <!-- EQ & Spectrum Panel (only visible in singing mode) -->
        <details class="panel eq-panel" id="eq-panel" hidden>
          <summary>
            <span class="panel-title"><span aria-hidden="true">☷</span> EQ 與頻譜</span>
            <span class="panel-summary">歡唱 EQ 調整</span>
          </summary>
          <div class="panel-body">
            <div class="eq-header">
              <span>5 段等化器</span>
              <button type="button" class="btn btn-ghost btn-small" id="eq-reset-btn">全部重置</button>
            </div>

            <div class="eq-spectrum-row">
              <!-- 5-Band EQ -->
              <div class="eq-sliders">
                <div class="eq-band">
                  <output class="eq-value" id="eq-low-val" for="eq-low">0 dB</output>
                  <input type="range" class="eq-slider" id="eq-low" min="-12" max="12" step="1" value="0" aria-valuetext="0 dB">
                  <label for="eq-low">低音<br>60Hz</label>
                </div>
                <div class="eq-band">
                  <output class="eq-value" id="eq-lowmid-val" for="eq-lowmid">0 dB</output>
                  <input type="range" class="eq-slider" id="eq-lowmid" min="-12" max="12" step="1" value="0" aria-valuetext="0 dB">
                  <label for="eq-lowmid">低中<br>250Hz</label>
                </div>
                <div class="eq-band">
                  <output class="eq-value" id="eq-mid-val" for="eq-mid">0 dB</output>
                  <input type="range" class="eq-slider" id="eq-mid" min="-12" max="12" step="1" value="0" aria-valuetext="0 dB">
                  <label for="eq-mid">中頻<br>1kHz</label>
                </div>
                <div class="eq-band">
                  <output class="eq-value" id="eq-himid-val" for="eq-himid">0 dB</output>
                  <input type="range" class="eq-slider" id="eq-himid" min="-12" max="12" step="1" value="0" aria-valuetext="0 dB">
                  <label for="eq-himid">高中<br>4kHz</label>
                </div>
                <div class="eq-band">
                  <output class="eq-value" id="eq-high-val" for="eq-high">0 dB</output>
                  <input type="range" class="eq-slider" id="eq-high" min="-12" max="12" step="1" value="0" aria-valuetext="0 dB">
                  <label for="eq-high">高音<br>12kHz</label>
                </div>
              </div>

              <!-- Spectrum Analyzer -->
              <div class="spectrum-container" id="spectrum-container">
                <canvas id="spectrum-canvas" width="400" height="120" aria-hidden="true"></canvas>
              </div>
            </div>
          </div>
        </details>
      </section>

      <aside class="playlist-section" aria-labelledby="playlist-heading">
        <div class="playlist-header">
          <h2 id="playlist-heading" class="playlist-title">
            待播清單 <small id="queue-count">0 首</small>
          </h2>
          <div class="playlist-actions">
            <button type="button" class="btn btn-ghost btn-icon-only" id="export-playlist-btn" title="匯出清單">
              <span aria-hidden="true">↑</span> 匯出
            </button>
            <button type="button" class="btn btn-ghost btn-icon-only" id="import-playlist-btn" title="匯入清單">
              <span aria-hidden="true">↓</span> 匯入
            </button>
            <span class="action-divider" aria-hidden="true"></span>
            <button type="button" class="btn btn-ghost btn-danger-ghost" id="clear-playlist-btn" title="清空清單">
              <span aria-hidden="true">×</span> 清空
            </button>
          </div>
        </div>
        <ul id="playlist-items" class="playlist-list">
          <li class="empty-queue">搜尋歌曲，開始你的歡唱清單</li>
        </ul>
      </aside>
    </main>

    <footer>
      <span>Copyright © James</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="confirm-clear-dialog" class="confirm-dialog" closedby="any" aria-labelledby="confirm-clear-title" aria-describedby="confirm-clear-desc">
    <form method="dialog" class="dialog-content">
      <h2 id="confirm-clear-title">清空待播清單？</h2>
      <p id="confirm-clear-desc">這會停止目前播放並移除所有待播歌曲，此動作無法復原。</p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-ghost">取消</button>
        <button type="submit" value="confirm" class="btn btn-danger">確定清空</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/main.js"></script>
</body>

</html>
