<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡拉OK神歡唱系統</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="/eel.js"></script>
</head>

<body>
  <div id="app" class="fade-in">
    <header>
      <h1>卡拉OK神歡唱系統</h1>
      <p>原唱導唱 · 快速歡唱 · AI 立體聲伴奏</p>
      <span id="quality-status" class="quality-badge">本機歡唱工作室</span>
    </header>

    <div class="search-container">
      <input type="text" id="search-input" maxlength="300" aria-label="搜尋歌曲" placeholder="輸入搜尋關鍵字或 YouTube 網址...">
      <div class="loader" id="search-loader"></div>
      <button class="btn" id="search-btn">
        <span aria-hidden="true">⌕</span> 搜尋
      </button>
    </div>

    <p id="app-status" class="status-line" role="status" aria-live="polite">搜尋歌曲或匯入清單，開始歡唱</p>
    <div class="results-section" id="results-section">
      <h3>搜尋結果</h3>
      <div class="results-grid" id="results-grid">
        <!-- Results will be injected here -->
      </div>
    </div>

    <div class="main-content">
      <div class="player-section">
        <div id="video-wrapper">
          <video id="player" controls crossorigin="anonymous" preload="auto"></video>
          <!-- Custom error/loading overlay could go here -->
        </div>

        <div class="controls-row">
          <div class="song-info">
            <h2 id="now-playing-title">尚未播放歌曲</h2>
            <button class="btn btn-small" id="skip-btn" title="下一首">
              <span aria-hidden="true">⏭</span> 切歌
            </button>
          </div>

          <div class="media-controls">
            <div class="volume-container">
              <span aria-hidden="true">🔊</span>
              <input type="range" id="volume-slider" aria-label="播放音量" min="0" max="1" step="0.01" value="1">
            </div>

            <div class="mode-selector">
              <span class="mode-label active" id="label-guide">導唱</span>
              <button type="button" class="knob-switch" id="karaoke-knob" aria-label="切換歡唱模式" aria-pressed="false">
                <div class="knob-inner"></div>
              </button>
              <span class="mode-label" id="label-singing">歡唱</span>
            </div>
          </div>
        </div>

        <div class="ai-panel">
          <div class="ai-heading"><strong>AI 伴奏工作室</strong><button class="btn btn-small" id="prepare-ai-btn" disabled>製作 AI 伴奏</button></div>
          <p id="ai-status" role="status" aria-live="polite">正在檢查 AI 環境…</p>
          <div id="ai-progress-panel" class="ai-progress-panel" hidden>
            <div class="ai-progress-heading"><span id="ai-progress-stage">準備中</span><span id="ai-progress-percent">等待進度…</span></div>
            <progress id="ai-progress" max="100" aria-label="目前 AI 工作階段進度"></progress>
            <div class="ai-progress-meta"><span id="ai-progress-detail"></span><span id="ai-progress-elapsed"></span></div>
          </div>
          <button class="btn btn-ghost" id="cancel-ai-btn" hidden>取消製作</button>
          <label class="ai-toggle"><input type="checkbox" id="use-ai" disabled> 使用 AI 伴奏（完成後可切換原唱／歡唱）</label>
          <p class="mode-note" id="mode-detail">快速模式：削弱中央人聲，也可能影響中央樂器</p>
        </div>
        <!-- EQ & Spectrum Panel (only visible in singing mode) -->
        <div class="eq-panel" id="eq-panel">
          <div class="eq-header">
            <span><span aria-hidden="true">☷</span> 歡唱 EQ 調整</span>
            <button class="btn btn-ghost btn-small" id="eq-reset-btn">重置</button>
          </div>

          <div class="eq-spectrum-row">
            <!-- 5-Band EQ -->
            <div class="eq-sliders">
              <div class="eq-band">
                <input type="range" class="eq-slider" id="eq-low" aria-label="低音 EQ" min="-12" max="12" step="1" value="0"
                  orient="vertical">
                <label>低音<br>60Hz</label>
              </div>
              <div class="eq-band">
                <input type="range" class="eq-slider" id="eq-lowmid" aria-label="低中頻 EQ" min="-12" max="12" step="1" value="0"
                  orient="vertical">
                <label>低中<br>250Hz</label>
              </div>
              <div class="eq-band">
                <input type="range" class="eq-slider" id="eq-mid" aria-label="中頻 EQ" min="-12" max="12" step="1" value="0"
                  orient="vertical">
                <label>中頻<br>1kHz</label>
              </div>
              <div class="eq-band">
                <input type="range" class="eq-slider" id="eq-himid" aria-label="高中頻 EQ" min="-12" max="12" step="1" value="0"
                  orient="vertical">
                <label>高中<br>4kHz</label>
              </div>
              <div class="eq-band">
                <input type="range" class="eq-slider" id="eq-high" aria-label="高頻 EQ" min="-12" max="12" step="1" value="0"
                  orient="vertical">
                <label>高音<br>12kHz</label>
              </div>
            </div>

            <!-- Spectrum Analyzer -->
            <div class="spectrum-container">
              <canvas id="spectrum-canvas" width="400" height="120"></canvas>
            </div>
          </div>

          <div class="eq-extra">
            <div class="vocal-strength" id="quick-controls">
              <label for="vocal-strength">中央人聲削弱</label>
              <input type="range" id="vocal-strength" min="0" max="1" step="0.05" value="0.8">
              <span id="vocal-strength-val">80%</span>
            </div>
            <div>
              <label for="accompaniment-gain">伴奏增益</label>
              <input type="range" id="accompaniment-gain" min="0" max="1.5" step="0.1" value="1">
              <span id="accompaniment-gain-val">1.0x</span>
            </div>
          </div>
        </div>

      </div>

      <div class="playlist-section">
        <div class="playlist-header">
          <span>待播清單 <small id="queue-count">0 首</small></span>
          <div class="playlist-actions">
            <button class="btn btn-ghost btn-icon-only" id="export-playlist-btn" title="匯出清單">
              <span aria-hidden="true">↑</span> 匯出
            </button>
            <button class="btn btn-ghost btn-icon-only" id="import-playlist-btn" title="匯入清單">
              <span aria-hidden="true">↓</span> 匯入
            </button>
            <button class="btn btn-ghost" id="clear-playlist-btn" title="清空清單">
              <span aria-hidden="true">×</span> 清空
            </button>
          </div>
        </div>
        <div id="playlist-items">
          <!-- Playlist items will be injected here -->
          <p style="text-align: center; color: rgba(255,255,255,0.3); padding-top: 20px;">目前沒有待播歌曲</p>
        </div>
      </div>
    </div>


    <footer>
      <span>Copyright © James </span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>

</html>
